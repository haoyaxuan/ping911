<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ping911</title>
    <link rel="shortcut icon" href="/assets/favicon.ico">
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
            color: #172033;
            background: #f7f8fa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            background: #f7f8fa;
        }

        button,
        textarea {
            font: inherit;
        }

        .site-header {
            height: 64px;
            border-bottom: 1px solid #e2e6ec;
            background: #ffffff;
        }

        .header-inner,
        main {
            width: min(920px, calc(100% - 32px));
            margin: 0 auto;
        }

        .header-inner {
            display: flex;
            align-items: center;
            height: 100%;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            color: #172033;
        }

        .brand img {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        main {
            padding: 40px 0 56px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 26px;
            line-height: 1.3;
            letter-spacing: 0;
        }

        .subtitle {
            margin: 0 0 24px;
            color: #667085;
            font-size: 14px;
        }

        textarea {
            display: block;
            width: 100%;
            min-height: 220px;
            resize: vertical;
            padding: 16px;
            border: 1px solid #cbd2dc;
            border-radius: 6px;
            outline: none;
            background: #ffffff;
            color: #172033;
            line-height: 1.65;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        textarea::placeholder {
            color: #98a2b3;
        }

        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 52px;
            margin-top: 12px;
        }

        .error-message {
            min-width: 0;
            margin-right: 16px;
            color: #b42318;
            font-size: 14px;
        }

        .ping-button {
            flex: 0 0 auto;
            min-width: 112px;
            height: 42px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .ping-button:hover {
            background: #1d4ed8;
        }

        .ping-button:focus-visible {
            outline: 3px solid rgba(37, 99, 235, 0.25);
            outline-offset: 2px;
        }

        .ping-button:disabled {
            background: #94a3b8;
            cursor: wait;
        }

        .results {
            margin-top: 32px;
            border-top: 1px solid #e2e6ec;
        }

        .results-header,
        .result-row {
            display: grid;
            grid-template-columns: minmax(180px, 1fr) 140px 120px;
            align-items: center;
            gap: 20px;
            min-height: 52px;
            padding: 0 12px;
            border-bottom: 1px solid #e2e6ec;
        }

        .results-header {
            color: #667085;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .result-row {
            background: #ffffff;
            font-size: 14px;
        }

        .result-ip {
            overflow-wrap: anywhere;
            font-family: Consolas, "SFMono-Regular", monospace;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .status::before {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            content: "";
        }

        .status.reachable {
            color: #067647;
        }

        .status.reachable::before {
            background: #12b76a;
        }

        .status.unreachable {
            color: #b42318;
        }

        .status.unreachable::before {
            background: #f04438;
        }

        .duration {
            color: #667085;
            text-align: right;
        }

        @media (max-width: 640px) {
            .header-inner,
            main {
                width: min(100% - 24px, 920px);
            }

            main {
                padding-top: 28px;
            }

            textarea {
                min-height: 240px;
            }

            .actions {
                align-items: stretch;
                flex-direction: column;
                gap: 10px;
            }

            .error-message:empty {
                display: none;
            }

            .ping-button {
                width: 100%;
            }

            .results-header {
                display: none;
            }

            .result-row {
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 8px 16px;
                padding: 12px;
            }

            .duration {
                grid-column: 1 / -1;
                text-align: left;
            }
        }
    </style>
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <div class="brand">
            <img src="/assets/images/logo.png" alt="">
            <span>Ping911</span>
        </div>
    </div>
</header>

<main>
    <h1>ICMP Ping</h1>
    <p class="subtitle">批量检测 IP 的网络可达性</p>

    <form id="pingForm">
        <label for="ipInput" hidden>IP 地址</label>
        <textarea id="ipInput" name="ips" spellcheck="false" autofocus
                  placeholder="每行输入一个 IP，例如：&#10;1.1.1.1&#10;8.8.8.8"></textarea>
        <div class="actions">
            <div id="errorMessage" class="error-message" role="alert"></div>
            <button id="pingButton" class="ping-button" type="submit">Ping</button>
        </div>
    </form>

    <section id="results" class="results" aria-live="polite" hidden>
        <div class="results-header">
            <span>IP 地址</span>
            <span>状态</span>
            <span class="duration">检测耗时</span>
        </div>
        <div id="resultList"></div>
    </section>
</main>

<script>
    const form = document.getElementById('pingForm');
    const input = document.getElementById('ipInput');
    const button = document.getElementById('pingButton');
    const errorMessage = document.getElementById('errorMessage');
    const results = document.getElementById('results');
    const resultList = document.getElementById('resultList');

    form.addEventListener('submit', async function (event) {
        event.preventDefault();
        const ips = input.value.trim();
        errorMessage.textContent = '';

        if (!ips) {
            errorMessage.textContent = '请输入至少一个 IP 地址';
            input.focus();
            return;
        }

        setLoading(true);
        try {
            const response = await fetch('/api/ping', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ips: ips})
            });
            const payload = await response.json();
            if (!response.ok || !payload.status) {
                throw new Error(payload.message || 'Ping 检测失败');
            }
            renderResults(payload.data || []);
        } catch (error) {
            errorMessage.textContent = error.message || 'Ping 检测失败';
        } finally {
            setLoading(false);
        }
    });

    function setLoading(loading) {
        button.disabled = loading;
        button.textContent = loading ? '检测中...' : 'Ping';
    }

    function renderResults(items) {
        resultList.replaceChildren();
        items.forEach(function (item) {
            const row = document.createElement('div');
            row.className = 'result-row';

            const ip = document.createElement('span');
            ip.className = 'result-ip';
            ip.textContent = item.ip;

            const status = document.createElement('span');
            status.className = 'status ' + (item.reachable ? 'reachable' : 'unreachable');
            status.textContent = item.reachable ? '可达' : (item.message || '不可达');

            const duration = document.createElement('span');
            duration.className = 'duration';
            duration.textContent = item.durationMs + ' ms';

            row.append(ip, status, duration);
            resultList.appendChild(row);
        });
        results.hidden = items.length === 0;
    }
</script>
</body>
</html>
