name: Build Docker image

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target server platform
        required: true
        default: linux/amd64
        type: choice
        options:
          - linux/amd64
          - linux/arm64
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build image artifact
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          platform="${{ inputs.platform || 'linux/amd64' }}"
          arch="${platform#linux/}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="sha-${GITHUB_SHA::7}"
          fi

          version="${version//\//-}"
          file_name="ping911-${version}-${arch}.tar"

          echo "platform=${platform}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "file_name=${file_name}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=ping911-${version}-${arch}" >> "${GITHUB_OUTPUT}"

      - name: Build Docker image archive
        shell: bash
        run: |
          mkdir -p dist
          docker buildx build \
            --platform "${{ steps.meta.outputs.platform }}" \
            --tag "ping911:latest" \
            --tag "ping911:${{ steps.meta.outputs.version }}" \
            --output "type=docker,dest=dist/${{ steps.meta.outputs.file_name }}" \
            .

          cp compose.yaml dist/compose.yaml
          cp config/config.example.yaml dist/config.yaml
          cd dist
          sha256sum "${{ steps.meta.outputs.file_name }}" > "${{ steps.meta.outputs.file_name }}.sha256"

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
